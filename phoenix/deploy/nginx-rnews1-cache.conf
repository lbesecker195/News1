# Rnews1 — nginx as a caching layer in front of the Node app.
#
#   Caddy :443  ->  nginx 127.0.0.1:8080  ->  node 127.0.0.1:4000
#
# Only Rnews1 traffic reaches this server block: Caddy is what routes by
# hostname, and only the Rnews1 hosts are proxied here. Other applications on
# this box keep their own nginx server blocks on their own ports and domains
# and are not affected by anything in this file — the cache, its zone and its
# rules all live inside this one listener.
#
# Installed at /etc/nginx/conf.d/rnews1-cache.conf by saas/deploy/deploy.sh.

# ---- the cache -------------------------------------------------------------
#
# 500 MB on disk, dropped after a day untouched. keys_zone holds the index in
# memory: 10 MB is roughly 80,000 pages, far more than this will ever hold.

proxy_cache_path /var/cache/nginx/rnews1
                 levels=1:2
                 keys_zone=rnews1:10m
                 max_size=500m
                 inactive=24h
                 use_temp_path=off;

upstream rnews1_app {
    server 127.0.0.1:4000;
    keepalive 32;
}

# A signed-in visitor must never be served, or have stored, a page rendered
# for somebody else: the header says "Dashboard" to them and "Sign in" to
# everyone else. Readers of customer sites carry no session at all, which is
# why almost everything is still cacheable.
map $http_cookie $rnews1_private {
    default                                 0;
    "~*(^|;\s*)(session|admin_session)="    1;
}

# Caddy terminates TLS, so the scheme the browser used arrives in a header.
map $http_x_forwarded_proto $rnews1_proto {
    default  $http_x_forwarded_proto;
    ""       $scheme;
}

server {
    listen 127.0.0.1:8080 default_server;
    server_name _;

    # Caddy has already limited what reaches here, but the app also caps
    # bodies at 64 KB; anything larger is a mistake worth refusing early.
    client_max_body_size 1m;

    # One cache for many hostnames: the host is part of the key, or
    # acme.rnews1.com and www.rnews1.com would serve each other's pages.
    proxy_cache_key "$rnews1_proto$host$request_uri";

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $rnews1_proto;
    proxy_set_header X-Forwarded-Host $host;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    # Visible in curl -I, so "is this cached?" is answerable without guessing.
    add_header X-Cache $upstream_cache_status always;

    # Everything not named below goes straight through: the dashboard, the
    # API, the admin, sign-in links, briefs, PDFs, the click beacon, webhooks.
    # A deny-list would eventually miss something; this allows nothing by
    # default and names what is safe.
    location / {
        proxy_pass http://rnews1_app;
    }

    # The public pages, cached for an hour:
    #
    #   /                     a customer's site index, the marketing page
    #   /news/<id>            a hosted story
    #   /feed.xml  /embed     the feed and the embeddable widget
    #   /{lang}/...           the editorial archive, twelve languages
    #   /robots.txt  /sitemap.xml  /privacy  /terms
    #
    # The app says `public, max-age=300` on these; ignoring that here is what
    # makes it an hour at the edge while readers' browsers keep revalidating
    # every five minutes.
    location ~ ^/(?:$|news/|feed\.xml$|embed$|robots\.txt$|sitemap\.xml$|privacy$|terms$|(?:ar|bn|en|es|fr|hi|it|la|pt|ru|ur|zh)(?:/|$)) {
        proxy_pass http://rnews1_app;

        proxy_cache rnews1;
        proxy_ignore_headers Cache-Control Expires;

        # Only 200s. A 301 is cheap to recompute and pinning one for an hour
        # is how a renamed subdomain or a newly verified custom domain would
        # keep redirecting to the wrong place.
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;

        # Never for, and never from, someone with a session; and never store
        # a response that sets a cookie.
        proxy_cache_bypass $rnews1_private;
        proxy_no_cache $rnews1_private $upstream_http_set_cookie;

        # One request refreshes an entry while everyone else is served the
        # old one, and a stumble upstream is invisible rather than fatal.
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_background_update on;
        proxy_cache_revalidate on;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
    }

    # The stylesheet and the scripts. Same hour, and they are the same bytes
    # for every host, but the key still includes the host — a few duplicate
    # entries cost nothing next to the risk of sharing a key across sites.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        proxy_pass http://rnews1_app;

        proxy_cache rnews1;
        proxy_ignore_headers Cache-Control Expires;
        proxy_cache_valid 200 1h;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_background_update on;
        proxy_cache_use_stale error timeout updating
                              http_500 http_502 http_503 http_504;
    }
}
